<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=440, initial-scale=1">
  <title>Selection Launcher promotional tile</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
    body { position: relative; display: flex; align-items: center; gap: 22px; padding: 34px; background: #0b3127; color: white; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body::after { content: ""; position: absolute; right: -80px; bottom: -95px; width: 240px; height: 240px; border: 38px solid rgba(114,201,173,.13); border-radius: 50%; }
    img { position: relative; z-index: 1; width: 130px; height: 130px; flex: none; }
    div { position: relative; z-index: 1; }
    h1 { margin: 0 0 12px; font: 700 31px/1.02 Georgia, serif; letter-spacing: -.03em; }
    p { margin: 0; color: #dce9df; font-size: 15px; line-height: 1.4; }
    strong { color: #f9f1ce; }
  </style>
</head>
<body>
  <img src="../store-icon-300.png" alt="">
  <div><h1>Selection<br>Launcher</h1><p><strong>Search or copy</strong><br>without the context menu.</p></div>
</body>
</html>
